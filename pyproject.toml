[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "inciweb-wildfires"
description = "Download wildfire incidents data from InciWeb"
keywords = ["wildfires", "inciweb", "geojson", "data"]
readme = "README.md"
authors = [
    {name = "Ben Welsh", email = "b@palewi.re"},
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.11"
dependencies = [
    "click",
    "geojson",
    "requests",
]
dynamic = ["version"]

[project.scripts]
inciwebwildfires = "inciweb_wildfires.cli:cmd"
inciweb-wildfires = "inciweb_wildfires.cli:cmd"

[project.urls]
Documentation = "https://palewi.re/docs/inciweb-wildfires/"
Source = "https://github.com/datadesk/inciweb-wildfires"
Issues = "https://github.com/datadesk/inciweb-wildfires/issues"

[dependency-groups]
dev = [
    "pre-commit",
    "ruff",
    "setuptools-scm",
    "twine",
    "ty",
]
test = [
    "pytest",
]
docs = [
    "myst-parser",
    "sphinx",
    "sphinx-autobuild",
    "sphinx-palewire-theme",
]

[tool.setuptools]
packages = ["inciweb_wildfires"]

[tool.setuptools_scm]

[tool.ruff]
target-version = "py311"
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "B", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-m", "not live"]
markers = [
    "live: talks to the real InciWeb website, so it can be slow or fail when InciWeb is down",
]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["inciweb_wildfires"]
